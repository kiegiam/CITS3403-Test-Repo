<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body class="premium-app-page auth-page login-page">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">FitTrack</a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-controls="mainNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="{{ url_for('login') }}">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-5">
                        <div class="card shadow-sm border-0 login-card">
                            <div class="card-body p-4 p-lg-5">

                                <p class="fw-semibold text-center mb-2" style="color: #635bff;">
                                    Welcome back
                                </p>

                                <h1 class="h2 text-center fw-bold mb-4">
                                    Login
                                </h1>

                                {% with messages = get_flashed_messages() %}
                                    {% if messages %}
                                        <div class="alert alert-danger" role="alert">
                                            {{ messages[0] }}
                                        </div>
                                    {% endif %}
                                {% endwith %}

                                <form id="loginForm" method="POST" action="{{ url_for('login') }}" novalidate>
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email address</label>
                                        <input
                                            type="email"
                                            class="form-control"
                                            id="email"
                                            name="email"
                                            placeholder="Enter your email"
                                            required
                                        >
                                        <div id="emailError" class="text-danger small mt-1"></div>
                                    </div>

                                    <div class="mb-2">
                                        <label for="password" class="form-label">Password</label>
                                        <input
                                            type="password"
                                            class="form-control"
                                            id="password"
                                            name="password"
                                            placeholder="Enter your password"
                                            required
                                        >
                                        <div id="passwordError" class="text-danger small mt-1"></div>
                                    </div>

                                    <div class="text-end mb-4">
                                        <a
                                            href="{{ url_for('forgot_password') }}"
                                            class="text-decoration-none small fw-semibold"
                                        >
                                            Forgot password?
                                        </a>
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-success">
                                            Log in
                                        </button>
                                    </div>
                                </form>

                                <hr class="my-4">


                                <p class="text-center mb-2">
                                    <a href="{{ url_for('home') }}" class="text-decoration-none">
                                        Back to home
                                    </a>
                                </p>

                                <p class="text-center mb-0">
                                    <span class="text-muted">Don't have an account?</span>
                                    <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">
                                        Sign up
                                    </a>
                                </p>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
