<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Sign Up</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">FitTrack</a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-controls="mainNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-5">
                        <div class="card shadow-sm border-0 login-card">
                            <div class="card-body p-4 p-lg-5">

                                <p class="fw-semibold text-center mb-2" style="color: #635bff;">
                                    Join FitTrack
                                </p>

                                <h1 class="h2 text-center fw-bold mb-4">
                                    Create Account
                                </h1>

                                {% with messages = get_flashed_messages() %}
                                    {% if messages %}
                                        <div class="alert alert-danger" role="alert">
                                            {{ messages[0] }}
                                        </div>
                                    {% endif %}
                                {% endwith %}

                                <form method="POST" action="{{ url_for('register') }}">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                                    <div class="mb-3">
                                        <label for="name" class="form-label">Name</label>
                                        <input
                                            type="text"
                                            class="form-control"
                                            id="name"
                                            name="name"
                                            placeholder="Enter your name"
                                            required
                                        >
                                    </div>

                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input
                                            type="email"
                                            class="form-control"
                                            id="email"
                                            name="email"
                                            placeholder="you@example.com"
                                            required
                                        >
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <input
                                            type="password"
                                            class="form-control"
                                            id="password"
                                            name="password"
                                            placeholder="At least 6 characters, no spaces"
                                            minlength="6"
                                            pattern="\S{6,}"
                                            title="Password must be at least 6 characters and cannot contain spaces."
                                            required
                                        >
                                        <div class="form-text">
                                            Password must be at least 6 characters and cannot contain spaces.
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label for="confirm_password" class="form-label">Confirm Password</label>
                                        <input
                                            type="password"
                                            class="form-control"
                                            id="confirm_password"
                                            name="confirm_password"
                                            placeholder="Enter your password again"
                                            minlength="6"
                                            pattern="\S{6,}"
                                            title="Password must be at least 6 characters and cannot contain spaces."
                                            required
                                        >
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-success">
                                            Sign Up
                                        </button>
                                    </div>
                                </form>

                                <hr class="my-4">

                                <p class="text-center mb-0">
                                    <span class="text-muted">Already have an account?</span>
                                    <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">
                                        Log in
                                    </a>
                                </p>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
