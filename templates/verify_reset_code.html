<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Verify Code</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body class="premium-app-page auth-page">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">FitTrack</a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-controls="mainNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-5">
                        <div class="card shadow-sm border-0 login-card">
                            <div class="card-body p-4 p-lg-5">

                                <p class="fw-semibold text-center mb-2" style="color: #635bff;">
                                    Verify your email
                                </p>

                                <h1 class="h2 text-center fw-bold mb-3">
                                    Enter verification code
                                </h1>

                                <p class="text-muted text-center mb-4">
                                    We sent a 6-digit verification code to
                                    <strong>{{ email }}</strong>.
                                </p>

                                {% with messages = get_flashed_messages() %}
                                    {% if messages %}
                                        <div class="alert alert-danger" role="alert">
                                            {{ messages[0] }}
                                        </div>
                                    {% endif %}
                                {% endwith %}

                                <form method="POST" action="{{ url_for('verify_reset_code') }}">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                                    <div class="mb-4">
                                        <label for="code" class="form-label">Verification Code</label>
                                        <input
                                            type="text"
                                            class="form-control"
                                            id="code"
                                            name="code"
                                            placeholder="Enter 6-digit code"
                                            maxlength="6"
                                            pattern="[0-9]{6}"
                                            required
                                        >
                                        <div class="form-text">
                                            The code expires in 10 minutes.
                                        </div>
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-success">
                                            Verify Code
                                        </button>
                                    </div>
                                </form>

                                <hr class="my-4">

                                <p class="text-center mb-2">
                                    <a href="{{ url_for('forgot_password') }}" class="text-decoration-none fw-semibold">
                                        Request a new code
                                    </a>
                                </p>

                                <p class="text-center mb-0">
                                    <a href="{{ url_for('login') }}" class="text-decoration-none">
                                        Back to login
                                    </a>
                                </p>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
